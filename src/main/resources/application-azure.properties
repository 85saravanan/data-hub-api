spring.datasource.url=jdbc:mysql://${AZURE_MYSQL_HOST}:${AZURE_MYSQL_PORT:3306}/${AZURE_MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${AZURE_MYSQL_USERNAME}
spring.datasource.password=${AZURE_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
